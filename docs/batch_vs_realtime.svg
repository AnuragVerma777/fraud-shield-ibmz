<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
  <title id="title">Batch evaluation and simulated stream latency comparison</title>
  <desc id="desc">Average and 95th percentile per-transaction latency in milliseconds. Batch test evaluation: average 23.070, p95 28.833, from 1000 individual calls. Stream replay: average 27.339, p95 28.463, from 20 events.</desc>
  <rect width="900" height="490" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#172033">Per-transaction scoring latency</text>
  <text x="450" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#596579">Local measurements · milliseconds · shorter is faster</text>
  <g font-family="Arial,sans-serif" font-size="12" fill="#596579">
    <text x="110" y="414" text-anchor="middle">0</text><text x="300" y="414" text-anchor="middle">10</text>
    <text x="490" y="414" text-anchor="middle">20</text><text x="680" y="414" text-anchor="middle">30</text>
  </g>
  <g stroke="#d8dee8" stroke-width="1">
    <line x1="110" y1="100" x2="110" y2="397"/><line x1="300" y1="100" x2="300" y2="397"/>
    <line x1="490" y1="100" x2="490" y2="397"/><line x1="680" y1="100" x2="680" y2="397"/>
    <line x1="110" y1="397" x2="680" y2="397"/>
  </g>
  <text x="395" y="443" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#596579">Latency (ms)</text>
  <g font-family="Arial,sans-serif" fill="#172033">
    <text x="96" y="166" text-anchor="end" font-size="15" font-weight="700">Batch evaluation</text>
    <text x="96" y="185" text-anchor="end" font-size="11" fill="#596579">56,962 rows · sample n=1,000</text>
    <text x="96" y="286" text-anchor="end" font-size="15" font-weight="700">Stream replay</text>
    <text x="96" y="305" text-anchor="end" font-size="11" fill="#596579">20 events · paced at 20 TPS</text>
  </g>
  <rect x="110" y="132" width="438.324" height="26" rx="4" fill="#3977c3"/>
  <rect x="110" y="164" width="547.819" height="26" rx="4" fill="#8db7e8"/>
  <rect x="110" y="252" width="519.450" height="26" rx="4" fill="#188b73"/>
  <rect x="110" y="284" width="540.797" height="26" rx="4" fill="#80cbb8"/>
  <g font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#172033">
    <text x="557" y="150">Avg 23.070 ms</text><text x="666" y="182">P95 28.833 ms</text>
    <text x="638" y="270">Avg 27.339 ms</text><text x="660" y="302">P95 28.463 ms</text>
  </g>
  <g font-family="Arial,sans-serif" font-size="12" fill="#596579">
    <text x="110" y="470">Different sample sizes and the same test split; interpret as a local pipeline snapshot, not a production comparison.</text>
  </g>
</svg>
